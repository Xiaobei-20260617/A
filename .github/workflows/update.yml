name: Update Subscriptions

on:
  schedule:
    - cron: "*/30 * * * *"   # UTC 01:00 & 13:00 → 北京 09:00 & 21:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Run fetch_nodes.py (抓取订阅并生成 proxies.txt)
        timeout-minutes: 4
        run: |
          python3 fetch_nodes.py
          if [ ! -f output/fproxies/latest_clash.txt ]; then
            echo "❌ output/fproxies/latest_clash.txt 未生成"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
