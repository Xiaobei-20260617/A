name: Update Subscriptions

on:
  schedule:
    - cron: "0 1,13 * * *"   # UTC 01:00 & 13:00 → 北京 09:00 & 21:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Run original script to get subscription URL
        timeout-minutes: 3
        run: |
          python3 fetch_nodes.py
          if [ ! -f output/fproxies/latest_clash.txt ]; then
            echo "❌ output/fproxies/latest_clash.txt 未生成"
            exit 1
          fi
          echo "获取到的订阅链接："
          cat output/fproxies/latest_clash.txt

      - name: Download subscription content (no decoding)
        timeout-minutes: 3
        run: |
          # 读取链接，去除首尾空白
          URL=$(head -n 1 output/fproxies/latest_clash.txt | xargs)
          if [ -z "$URL" ]; then
            echo "❌ 链接为空"
            exit 1
          fi
          echo "使用 curl_cffi 下载：$URL"
          python3 -c "
          from curl_cffi import requests
          resp = requests.get('$URL', impersonate='chrome')
          with open('proxies.txt', 'wb') as f:
              f.write(resp.content)
          print(f'下载完成，大小 {len(resp.content)} 字节')
          "
          # 检查是否被 Cloudflare 拦截
          if grep -qi '<html' proxies.txt; then
            echo "❌ 遇到验证页面"
            cat proxies.txt
            exit 1
          fi
          echo "下载成功，行数：$(wc -l < proxies.txt)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi