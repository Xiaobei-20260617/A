name: Update Subscriptions

on:
  schedule:
    - cron: "0 1,13 * * *"   # UTC 01:00 & 13:00 → 北京 09:00 & 21:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Run original script to get subscription URL
        timeout-minutes: 3
        run: |
          python3 fetch_nodes.py
          # 确认链接文件存在
          if [ ! -f output/fproxies/latest_base64.txt ]; then
            echo "❌ output/fproxies/latest_base64.txt 未生成，请检查脚本"
            exit 1
          fi
          echo "从脚本获取到的链接："
          cat output/fproxies/latest_base64.txt

      - name: Fetch and decode subscription using URL from file
        timeout-minutes: 3
        run: |
          # 读取文件第一行作为 URL（去除首尾空白）
          URL=$(head -n 1 output/fproxies/latest_base64.txt | xargs)
          if [ -z "$URL" ]; then
            echo "❌ 链接为空"
            exit 1
          fi
          echo "使用 curl_cffi 拉取：$URL"
          python3 -c "
          from curl_cffi import requests
          resp = requests.get('$URL', impersonate='chrome')
          with open('sub.b64', 'wb') as f:
              f.write(resp.content)
          print(f'下载完成，大小 {len(resp.content)} 字节')
          "
          # 检查是否仍为 Cloudflare 页面
          if grep -qi '<html' sub.b64; then
            echo "❌ 遇到验证页面，内容如下："
            cat sub.b64
            exit 1
          fi
          echo "Base64 解码..."
          base64 -d sub.b64 > proxies.txt 2>/dev/null || cp sub.b64 proxies.txt
          echo "代理行数：$(wc -l < proxies.txt)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi