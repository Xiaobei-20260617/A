name: 定时拉取订阅

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 curl_cffi
        run: pip install curl_cffi

      - name: 拉取并解码订阅
        run: |
          URL="https://sub.danhu.dpdns.org/paste/TG@FProxies260627oX3VJoI/base64"
          echo "使用 curl_cffi 模拟 Chrome 指纹拉取..."

          python3 -c "
          from curl_cffi import requests
          resp = requests.get('$URL', impersonate='chrome')
          with open('sub.b64', 'wb') as f:
              f.write(resp.content)
          print(f'下载完成，大小 {len(resp.content)} 字节')
          "

          # 检查是否返回 Cloudflare 验证页面
          if grep -qi '<html' sub.b64; then
            echo "❌ 下载失败，仍遇到验证页面，内容如下："
            cat sub.b64
            exit 1
          fi

          echo "下载成功，正在 base64 解码..."
          base64 -d sub.b64 > proxies.txt 2>/dev/null || cp sub.b64 proxies.txt
          echo "获取到代理行数：$(wc -l < proxies.txt)"

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.txt sub.b64
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "更新订阅 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi