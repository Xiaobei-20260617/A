name: 定时拉取订阅

on:
  schedule:
    # 每天 UTC 0 点运行，可自行修改 cron 表达式
    - cron: '0 0 * * *'
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write      # 允许推送提交

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载并解码订阅
        run: |
          URL="https://sub.danhu.dpdns.org/paste/TG@FProxies260627oX3VJoI/base64"
          echo "正在拉取..."
          curl -sL "$URL" -o sub.b64
          # 尝试 base64 解码，解码失败则保留原始文件
          base64 -d sub.b64 > proxies.txt 2>/dev/null || cp sub.b64 proxies.txt
          echo "获取到代理行数："
          wc -l proxies.txt

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.txt sub.b64
          # 仅当文件有变化时才提交
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "更新订阅 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi