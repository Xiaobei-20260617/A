name: 定时拉取订阅

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载并解码订阅 (使用 curl-impersonate Docker 镜像)
  run: |
    URL="https://sub.danhu.dpdns.org/paste/TG@FProxies260627oX3VJoI/base64"
    echo "正在使用 curl-impersonate (chrome 指纹) 拉取..."
    docker run --rm lwthiker/curl-impersonate:chrome \
      curl -sL "$URL" -o sub.b64

    # 检查是否返回 Cloudflare 页面
    if grep -qi '<html' sub.b64; then
      echo "❌ 仍遇到验证页面"
      cat sub.b64
      exit 1
    fi

    base64 -d sub.b64 > proxies.txt 2>/dev/null || cp sub.b64 proxies.txt
    echo "获取行数：$(wc -l < proxies.txt)"


      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.txt sub.b64
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "更新订阅 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi