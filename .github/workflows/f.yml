name: 定时拉取订阅

on:
  schedule:
    # 每天 UTC 0 点运行，可根据需要修改
    - cron: '0 0 * * *'
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write      # 允许推送提交

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 拉取并解码订阅 (curl-impersonate chrome)
        run: |
          URL="https://sub.danhu.dpdns.org/paste/TG@FProxies260627oX3VJoI/base64"
          echo "正在使用 curl-impersonate (chrome 指纹) 拉取..."
          docker run --rm lwthiker/curl-impersonate:chrome \
            curl -sL "$URL" -o sub.b64

          # 检查是否返回了 Cloudflare 验证页面（或其他 HTML）
          if grep -qi '<html' sub.b64; then
            echo "❌ 下载失败，仍遇到验证页面，内容如下："
            cat sub.b64
            exit 1
          fi

          echo "下载成功，正在 base64 解码..."
          # 解码为纯文本，若解码失败则保留原始文件
          base64 -d sub.b64 > proxies.txt 2>/dev/null || cp sub.b64 proxies.txt
          echo "获取到代理行数：$(wc -l < proxies.txt)"

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.txt sub.b64
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "更新订阅 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi